# Variables de entorno: copia .env.example a .env y edita.
# Usuario inicial: EBK_INIT_ADMIN_USERNAME, EBK_INIT_ADMIN_PASSWORD, EBK_INIT_ADMIN_EMAIL.
# Moneda por defecto admite COP (peso colombiano), CLP, USD, EUR, etc. Ver docs/USUARIOS_Y_PERMISOS.md.

services:
  backend:
    container_name: ezbookkeeping-backend
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      EBK_SERVER_STATIC_ROOT_PATH: /ezbookkeeping/public
      EBK_SERVER_HTTP_ADDR: 0.0.0.0
      EBK_SERVER_HTTP_PORT: "8080"
      EBK_SERVER_DOMAIN: localhost
      EBK_SERVER_ROOT_URL: http://localhost:8081/
    volumes:
      - ezbookkeeping-data:/ezbookkeeping/data
      - ezbookkeeping-storage:/ezbookkeeping/storage
      - ezbookkeeping-log:/ezbookkeeping/log
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    container_name: ezbookkeeping-frontend
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "8081:80"
    restart: unless-stopped

volumes:
  ezbookkeeping-data:
  ezbookkeeping-storage:
  ezbookkeeping-log:
